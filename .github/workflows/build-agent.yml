name: Build agent (Windows exe)

on:
  push:
    paths: ["agent/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyirsdk requests pyinstaller
      - name: Build
        working-directory: agent
        run: pyinstaller --onefile --console --name RelaisBleuMercureAgent agent.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelaisBleuMercureAgent
          path: agent/dist/RelaisBleuMercureAgent.exe
      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: Agent Relais Bleu Mercure (dernière version)
          body: "Télécharger RelaisBleuMercureAgent.exe ci-dessous. Double-clic, code équipe, Entrée."
          files: agent/dist/RelaisBleuMercureAgent.exe
          prerelease: false
